name: Build and Push Backend
on:
  push:
    branches: [ "main" ]
    paths:
      - 'application/form-api/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: ./application/form-api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/form-api:latest
      - name: Trigger Jenkins Pipeline
        run: |
          curl -i -f -L -X POST -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
          "http://13.201.226.86:8080/job/devops-portfolio-pipeline/build?token=pipeline-ready"