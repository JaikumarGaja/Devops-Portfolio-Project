services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile  
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  
    env_file:
      - ./frontend/.env
    ports:
      - "4000:4000"
    depends_on:
      - backend
