apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: form
  template:
    metadata:
      labels:
        app: form
    spec:
      containers:
      - name: form
        image: jaikumargaja/form-app:latest
        ports:
        - containerPort: 4000
        env:
        - name: BACKEND_URL
          value: "http://backend-service:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: form-service
spec:
  type: NodePort
  selector:
    app: form
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30000