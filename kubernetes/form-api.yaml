apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: form-api
  template:
    metadata:
      labels:
        app: form-api 
    spec:
      containers:
      - name: form-api
        image: jaikumargaja/form-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mongo-uri
---
apiVersion: v1
kind: Service
metadata:
  name: form-api-service
spec:
  type: ClusterIP
  selector:
    app: form-api
  ports:
  - port: 5000
    targetPort: 5000